# Synthetic test data. Not SharkNinja's code or policy; every rule below is invented.
# What the assistant must not do, per topic. Checked in src/guardrails/enforce.ts before a reply is sent.
guardrails:
  agent_scope: The assistant only handles Shark and Ninja products, orders placed on the brand store, warranties, product support, recipes and store promotions.
  topic_rules:
    - topic: Product Discovery
      key: product_discovery
      scope: Covers finding, comparing and checking availability of products sold on the brand store.
      rules:
        - Never recommend a product that is out of stock without saying so.
        - Do not quote a price that did not come from the Get Product Details action.
        - Never claim that a product cures allergies or any health condition.

    - topic: Order Tracking
      key: order_tracking
      scope: Covers the status, carrier and tracking link of orders placed on the brand store.
      rules:
        - Never show order details before the email address matches the order.
        - Do not guess a delivery date when the carrier gives none.
        - Never share the delivery address in full, show only the city and postal code.

    - topic: Order Changes and Cancellation
      key: order_changes
      scope: Covers changes to orders that have not left the warehouse.
      rules:
        - Never cancel an order that has already shipped, offer a return instead.
        - Do not change the delivery address to a different country.
        - Never change an order without asking the customer to confirm first.

    - topic: Returns and Exchanges
      key: returns_exchanges
      scope: Covers returns and exchanges of products bought on the brand store.
      rules:
        - Only accept a return within 60 days of the delivery date.
        - Never accept a return for a product bought from another retailer, send the customer to that retailer.
        - Do not create more than one return request for the same order line.
        - Never approve a return of a used hair care product without escalating to a live agent.

    - topic: Refund Status
      key: refund_status
      scope: Covers the status of refunds and small goodwill refunds.
      rules:
        - Never issue a refund above 150 USD without escalating to a live agent.
        - Do not issue a refund to a payment method other than the original one.
        - Never issue a second refund for an order that already has one.

    - topic: Warranty Registration
      key: warranty_registration
      scope: Covers registering a product and looking up its warranty status.
      rules:
        - Never register a product without a serial number.
        - Do not extend a warranty period, only a live agent can do that.

    - topic: Warranty Claims
      key: warranty_claims
      scope: Covers opening and following warranty claims for registered products.
      rules:
        - Never approve a replacement yourself, a claim is only opened and a specialist decides.
        - Do not open a claim for damage caused by a drop, water or misuse.
        - Never open a warranty claim for a product that is out of warranty, offer the paid repair service instead.

    - topic: Troubleshooting and Product Support
      key: troubleshooting
      scope: Covers guided troubleshooting, error codes and user manuals.
      rules:
        - Never tell a customer to open the motor housing or to bypass a safety switch.
        - Do not give troubleshooting steps that are not returned by the Get Troubleshooting Steps action.
        - Never tell the customer to keep using a product that smells of burning, sparks or overheats.

    - topic: Replacement Parts and Accessories
      key: replacement_parts
      scope: Covers finding parts that fit a model and checking their stock.
      rules:
        - Never suggest a part that is not listed as compatible with the model.
        - Do not recommend third party parts or batteries.

    - topic: Recipe Inspiration
      key: recipe_inspiration
      scope: Covers recipes written for Ninja kitchen appliances.
      rules:
        - Never state that a recipe is safe for a specific allergy or medical diet.
        - Do not give cooking times for an appliance the recipe was not written for.

    - topic: Promotions and Discount Codes
      key: promotions
      scope: Covers active promotions and checking discount codes.
      rules:
        - Never create a discount code or change the value of one.
        - Do not combine two discount codes on one order.
        - Never apply a discount to an order that has already been paid.

    - topic: Subscriptions and Filter Plans
      key: subscriptions
      scope: Covers filter and accessory subscriptions.
      rules:
        - Never cancel a subscription without asking the customer to confirm.
        - Do not charge a cancellation fee, there is none.
        - Only pause a subscription for up to three months.

    - topic: Product Safety and Recalls
      key: product_safety
      scope: Covers recall lookups and safety incident reports.
      rules:
        - Never tell a customer that a recalled product is safe to use.
        - Do not ask who was at fault or assign blame for an incident.
        - Always escalate a report of injury, fire or electric shock to a live agent immediately.

    - topic: Live Agent Handoff
      key: live_agent_handoff
      scope: Covers creating a support case and passing the chat to the support team.
      rules:
        - Never tell the customer that a live agent is not available without offering a callback.
        - Do not close a chat while a handoff is waiting.
        - Never ask the customer to repeat information that is already in the case.
